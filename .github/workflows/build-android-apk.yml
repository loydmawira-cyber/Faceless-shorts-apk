name: Build Android APK (FacelessShorts AutoPilot)

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type to Generate'
        required: true
        default: 'debug'
        type: choice
        options:
          - 'debug'
          - 'release'
          - 'both'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK & Build Tools 35
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses & Pre-install Android 35
        run: |
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin
          yes | sdkmanager --licenses || true
          for d in "$ANDROID_HOME"/cmdline-tools/*/bin; do
            if [ -f "$d/sdkmanager" ]; then
              yes | "$d/sdkmanager" --licenses || true
            fi
          done
          sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Configure Gradle Environment
        run: |
          # Detect whether project is in android/ or root
          if [ -d "./android" ]; then
            echo "PROJECT_DIR=android" >> $GITHUB_ENV
            TARGET_DIR="android"
          else
            echo "PROJECT_DIR=." >> $GITHUB_ENV
            TARGET_DIR="."
          fi

          if [ -f "$TARGET_DIR/gradlew" ]; then
            chmod +x "$TARGET_DIR/gradlew" || true
          fi

      - name: Build Android Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Building Debug APK in directory: $(pwd)..."
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Build Android Release APK (Optional)
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' || github.event_name != 'workflow_dispatch' }}
        working-directory: ${{ env.PROJECT_DIR }}
        continue-on-error: true
        run: |
          echo "Building Release APK in directory: $(pwd)..."
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease --stacktrace --no-daemon || true
          else
            gradle assembleRelease --stacktrace --no-daemon || true
          fi

      - name: List & Verify Generated APKs
        run: |
          echo "=== Generated Android APKs ==="
          find . -name "*.apk" -type f -exec ls -lh {} + || true

          # Build GitHub Job Summary table
          echo "### 📱 Android APK Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | Path | Size |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          for apk in $(find . -name "*.apk" -type f); do
            apk_name=$(basename "$apk")
            apk_size=$(ls -lh "$apk" | awk '{print $5}')
            echo "| **$apk_name** | \`$apk\` | $apk_size |" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 💡 **How to install on Android:**" >> $GITHUB_STEP_SUMMARY
          echo "> 1. Download the artifact zip from the run summary below." >> $GITHUB_STEP_SUMMARY
          echo "> 2. Unzip and transfer the \`.apk\` to your Android phone." >> $GITHUB_STEP_SUMMARY
          echo "> 3. Tap the file in Files/Downloads and enable 'Install from unknown sources' if prompted." >> $GITHUB_STEP_SUMMARY

      - name: Upload Debug APK Artifact (Installable)
        uses: actions/upload-artifact@v4
        with:
          name: FacelessShorts-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FacelessShorts-release-apk
          path: '**/build/outputs/apk/release/*.apk'
          if-no-files-found: ignore
          retention-days: 30
